name: Hprofile Actions
on: workflow_dispatch
jobs:
  Testing:
      runs-on: ubuntu-latest
      steps:
        - name: Code Checkout
          uses: actions/checkout@v7 

        - name: Maven Test
          run: mvn test

        - name: Check Code Style
          run: mvn checkstyle:check

        - name: Setup Java 11
          uses: actions/setup-java@v3
          with:
            distribution: 'temurin'
            java-version: '11'  

        - name: Setup sonar scanner    
          uses: warchant/setup-sonar-scanner@v7 

        - name: SonarQube Scan
          run: |
            sonar-scanner \
              -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
              -Dsonar.sources=${GITHUB_WORKSPACE}/src/ \
              -Dsonar.junit.reportPaths=${GITHUB_WORKSPACE}/target/surefire-reports/ \
              -Dsonar.jacoco.reportPaths=${GITHUB_WORKSPACE}/target/jacoco.exec \
              -Dsonar.java.checkstyle.reportPaths=${GITHUB_WORKSPACE}/target/checkstyle-result.xml \
              -Dsonar.java.binaries=${GITHUB_WORKSPACE}/target/classes/






        
